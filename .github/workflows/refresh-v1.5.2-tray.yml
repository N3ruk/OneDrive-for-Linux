name: Refresh OneDrive v1.5.2 tray assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v1.5.2-tray.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge visible artwork only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          scale = 1.15
          icons = [
              Path("assets/onedrive-tray-online.png"),
              Path("assets/onedrive-tray-syncing.png"),
              Path("assets/onedrive-tray-warning.png"),
          ]

          for path in icons:
              image = Image.open(path).convert("RGBA")
              if image.size != (128, 128):
                  raise SystemExit(f"Unexpected size for {path}: {image.size}")
              resized = image.resize(
                  (round(image.width * scale), round(image.height * scale)),
                  Image.Resampling.LANCZOS,
              )
              canvas = Image.new("RGBA", image.size, (0, 0, 0, 0))
              x = (image.width - resized.width) // 2
              y = (image.height - resized.height) // 2
              canvas.alpha_composite(resized, (x, y))
              canvas.save(path, optimize=True)
              print(path, canvas.getchannel("A").getbbox())
          PY

      - name: Validate only tray assets changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             assets/onedrive-tray-online.png             assets/onedrive-tray-syncing.png             assets/onedrive-tray-warning.png | sort)"
          test "$changed" = "$expected"

      - name: Update main through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(gh api "repos/$repo/git/commits/$base_sha" --jq .tree.sha)"

          make_blob() {
            local path="$1"
            local content
            content="$(base64 -w0 "$path")"
            jq -n --arg content "$content" '{content:$content,encoding:"base64"}' |
              gh api --method POST "repos/'"$repo"'/git/blobs" --input - --jq .sha
          }

          online_sha="$(make_blob assets/onedrive-tray-online.png)"
          syncing_sha="$(make_blob assets/onedrive-tray-syncing.png)"
          warning_sha="$(make_blob assets/onedrive-tray-warning.png)"

          tree_sha="$(
            jq -n               --arg base "$base_tree"               --arg online "$online_sha"               --arg syncing "$syncing_sha"               --arg warning "$warning_sha"               '{
                base_tree:$base,
                tree:[
                  {path:"assets/onedrive-tray-online.png",mode:"100644",type:"blob",sha:$online},
                  {path:"assets/onedrive-tray-syncing.png",mode:"100644",type:"blob",sha:$syncing},
                  {path:"assets/onedrive-tray-warning.png",mode:"100644",type:"blob",sha:$warning},
                  {path:".github/workflows/refresh-v1.5.2-tray.yml",mode:"100644",type:"blob",sha:null}
                ]
              }' |
              gh api --method POST "repos/$repo/git/trees" --input - --jq .sha
          )"

          commit_sha="$(
            jq -n               --arg message "fix: enlarge visible tray artwork for v1.5.2"               --arg tree "$tree_sha"               --arg parent "$base_sha"               '{message:$message,tree:$tree,parents:[$parent]}' |
              gh api --method POST "repos/$repo/git/commits" --input - --jq .sha
          )"

          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' |
            gh api --method PATCH "repos/$repo/git/refs/heads/main" --input -

          echo "FINAL_COMMIT=$commit_sha" >> "$GITHUB_ENV"

      - name: Build replacement v1.5.2 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-v1.5.2-tray.yml
          rm -rf /tmp/OneDrive-for-Linux-v1.5.2
          mkdir -p /tmp/OneDrive-for-Linux-v1.5.2
          rsync -a --exclude '.git' ./ /tmp/OneDrive-for-Linux-v1.5.2/
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/OneDrive-for-Linux-v1.5.2-hotfix.zip" OneDrive-for-Linux-v1.5.2
          unzip -t "$GITHUB_WORKSPACE/OneDrive-for-Linux-v1.5.2-hotfix.zip"
          sha256sum "$GITHUB_WORKSPACE/OneDrive-for-Linux-v1.5.2-hotfix.zip"

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset v1.5.2 OneDrive-for-Linux-v1.5.2-hotfix.zip -y
          gh release upload v1.5.2 OneDrive-for-Linux-v1.5.2-hotfix.zip

# One-shot publisher for v1.5
name: Publish OneDrive v1.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean v1.5 ZIP from validated source
        shell: bash
        run: |
          set -euo pipefail
          TARGET=363c34bcd4303c6114ea7329e1425ef157db714d
          mapfile -t files < <(git ls-tree -r --name-only "$TARGET" | grep -v '^CHANGELOG.md$')
          git archive \
            --format=zip \
            --prefix=OneDrive-for-Linux-v1.5/ \
            --output=OneDrive-for-Linux-v1.5-final.zip \
            "$TARGET" "${files[@]}"
          unzip -t OneDrive-for-Linux-v1.5-final.zip

      - name: Create release and upload v1.5 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.5 >/dev/null 2>&1; then
            gh release upload v1.5 OneDrive-for-Linux-v1.5-final.zip --clobber
          else
            gh release create v1.5 \
              OneDrive-for-Linux-v1.5-final.zip \
              --target 363c34bcd4303c6114ea7329e1425ef157db714d \
              --title 'OneDrive for Linux v1.5 — English Language Support' \
              --notes-file CHANGELOG.md
          fi
